<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VIDHI - model preview</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../lib/three.module.min.js" } }
  </script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createMonster } from '../src/models3d.js';

// Offline turntable used by tools/capture.mjs to shoot the README portraits.
// Lighting mirrors the game: a warm lantern key, a cold rim, heavy falloff.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

scene.add(new THREE.AmbientLight(0x8496c4, 0.8));
scene.add(new THREE.HemisphereLight(0x8a6a44, 0x1c1410, 1.45));

const key = new THREE.PointLight(0xffc490, 46, 18, 2);
key.position.set(-1.7, 1.9, 2.4);
scene.add(key);
const fill = new THREE.PointLight(0xff9a45, 17, 16, 2);
fill.position.set(2.4, 0.9, 1.8);
scene.add(fill);
const rim = new THREE.PointLight(0x86a0ff, 30, 14, 2);
rim.position.set(1.7, 2.1, -2.6);
scene.add(rim);
const under = new THREE.PointLight(0xff5522, 11, 7, 2);
under.position.set(0, 0.1, 1.3);
scene.add(under);

// Floor catches the contact shadow so the monster is standing, not floating.
const floorTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#241d16';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(Math.random() * 128, Math.random() * 128, Math.random() * 3, 0, 7);
    ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 6);
  return t;
})();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14).rotateX(-Math.PI / 2),
  new THREE.MeshPhongMaterial({ map: floorTex, shininess: 4 }),
);
scene.add(floor);

const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.55, depthWrite: false,
    map: (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      const t = new THREE.CanvasTexture(c);
      return t;
    })(),
  }),
);
shadow.material.blending = THREE.NormalBlending;
shadow.position.y = 0.004;
scene.add(shadow);

let current = null;

window.showMonster = (type, boss, height, opts = {}) => {
  if (current) {
    scene.remove(current.root);
    current.dispose();
  }
  // Always pin the variant: in game a monster picks one at random along with
  // its own tone and stature, which would make every capture run produce a
  // different creature and the idle/attack pair show two different bodies.
  current = createMonster(type, boss, height, opts.variant !== undefined ? opts.variant : 0);
  scene.add(current.root);
  shadow.scale.set(height * 1.5, 1, height * 1.5);
  scene.background = new THREE.Color(opts.bg !== undefined ? opts.bg : 0x0a0708);
  scene.fog = new THREE.FogExp2(scene.background, opts.fog !== undefined ? opts.fog : 0.09);
  return true;
};

window.shoot = (opts = {}) => {
  const {
    w = 640, h = 800, yaw = 0.5, pitch = 0.06, dist = 3.2, target = 0.55,
    pose = {},
  } = opts;
  renderer.setSize(w, h, false);
  canvas.width = w;
  canvas.height = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  current.pose({ t: 0.3, walk: 0, moving: 0, windup: 0, dead: 0, ...pose });
  current.root.rotation.y = yaw;

  camera.position.set(
    Math.sin(yaw + Math.PI) * 0 + Math.sin(0) * dist,
    target + Math.sin(pitch) * dist,
    dist,
  );
  camera.lookAt(0, target, 0);
  renderer.render(scene, camera);
  return true;
};

window.ready = true;
</script>
</body>
</html>
